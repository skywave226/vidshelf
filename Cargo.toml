[workspace]
resolver = "2"
members = ["crates/shared", "crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
video-manager-shared = { path = "crates/shared" }
video-manager-core = { path = "crates/core" }

[profile.release]
lto = true
codegen-units = 1
strip = true