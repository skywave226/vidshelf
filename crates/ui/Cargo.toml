[package]
name = "video-manager-ui"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["HtmlVideoElement", "HtmlMediaElement", "Window", "DomRect", "Document", "Element", "Node", "HtmlElement", "HtmlScriptElement", "HtmlHeadElement"] }
video-manager-shared = { path = "../shared" }